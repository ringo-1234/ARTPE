buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}
        
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.0.0'
group = 'jp.apple.rtm'
archivesBaseName = 'ARTPE-forge1.12.2'

sourceCompatibility = 1.8
targetCompatibility = 1.8
minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    implementation fg.deobf(files(project.file("libs/RTM.jar")))
    implementation fg.deobf(files(project.file("libs/NGTLib.jar")))
    implementation fg.deobf(files(project.file("libs/MCTE.jar")))
}
jar {
    manifest {
        attributes([
            "Specification-Title": "apple-rtm",
            "Specification-Vendor": "apple-rtm",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": "${version}",
            "Implementation-Vendor" :"apple-rtm",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
jar.finalizedBy('reobfJar') 

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
task copyJarToTest(type: Copy) {
    dependsOn 'reobfJar'
    from "build/libs"
    into "/Users/S/Documents/マイクラ/てすと/mods"
    include "${archivesBaseName}-${version}.jar"
}
build.dependsOn copyJarToTest
